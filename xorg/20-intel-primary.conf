# Pin the X screen to the Intel iGPU (PCI 0:2:0).
# On some boots the BIOS leaves the NVIDIA BARs unassigned, the kernel then
# marks the NVIDIA as boot VGA and X autoconfig crashes in a loop (blinking cursor).
Section "Device"
    Identifier "IntelIGPU"
    Driver     "modesetting"
    BusID      "PCI:0:2:0"
EndSection
Section "Screen"
    Identifier "IntelScreen"
    Device     "IntelIGPU"
EndSection
Section "ServerLayout"
    Identifier "IntelLayout"
    Screen     0 "IntelScreen"
EndSection
